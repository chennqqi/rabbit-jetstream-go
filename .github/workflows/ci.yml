name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: JetStream integration
        run: |
          docker run --rm -d --name rjs-sdk-ci -p 127.0.0.1:4222:4222 nats:2.12.4-alpine -js
          trap 'docker stop rjs-sdk-ci' EXIT
          for attempt in $(seq 1 40); do
            nc -z 127.0.0.1 4222 && break
            sleep 0.25
          done
          NATS_URL=nats://127.0.0.1:4222 go test -race -tags=integration -count=1 -coverprofile=coverage.out ./...
      - name: Enforce coverage
        run: ./scripts/check-coverage.sh coverage.out
